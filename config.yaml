# fingerling config
#
# Anything tagged PLACEHOLDER is a number nobody has measured yet. They're set to
# values that let the app run end-to-end, not to values anyone can defend. Phase 3
# replaces them with numbers off a real coverage curve. Don't quote them at anyone.

capture:
  # cv2.VideoCapture index for the webcam source.
  camera_index: 0
  # Frames larger than this on the long edge get downscaled before the pipeline
  # sees them. Keeps detection and calibration timing comparable across sources.
  max_long_edge_px: 1280

calibration:
  # Which target to look for. "auto" tries aruco first, then card.
  # One of: auto | aruco | card | none
  target: auto

  aruco:
    # OpenCV predefined dictionary name. DICT_4X4_50 has the largest modules for a
    # given physical marker size, so it survives being small on a phone screen.
    # See docs/DECISIONS.md — this was my default pick, not a measured one.
    dictionary: DICT_4X4_50
    # Physical side length of the printed/displayed marker's outer black square, mm.
    # null until you compute it from your phone's PPI. calibrate.py refuses to solve
    # an ArUco homography while this is null rather than guessing a scale.
    marker_length_mm: null

  card:
    # ISO/IEC 7810 ID-1. These two numbers are the standard, not a measurement of
    # any particular card, so they're exact to the stated precision.
    width_mm: 85.60
    height_mm: 53.98
    # A detected quad is rejected as "not a card" if its aspect ratio is further
    # than this (fractional) from 85.60/53.98. Loose enough to survive perspective.
    aspect_tolerance: 0.18
    # Contour area floor as a fraction of frame area — filters specks.
    min_area_frac: 0.002

  # PLACEHOLDER. RMS reprojection residual, in pixels, above which the frame's
  # calibration is called bad and every millimetre figure from it is suspect.
  # Real value comes from Phase 3 validation against known objects.
  # Only meaningful for the card target — see the long note at the top of
  # pipeline/calibrate.py for why a single ArUco marker can't produce one.
  max_reprojection_residual_px: 2.0

  # MEASURED, and lowered from the old placeholder of 2.0. 1.0 is perfectly
  # flat-on (in-plane rotation still scores 1.0); bigger means more tilt.
  #
  # eval/validate_mm swept a synthetic scene from obliquity 1.00 to 1.71.
  # Measurement accuracy does NOT degrade with tilt — max error stayed under
  # 0.15 mm across that whole range, because a homography undoes perspective
  # properly. What fails is DETECTION: past about 1.43 a foreshortened coin
  # stops being round enough to find, and past 1.71 the card itself isn't found.
  #
  # So 1.4 is not a measured failure point, it's the edge of the evidence. Past
  # it I have no data either way, and 2.0 never had any. docs/CALIBRATION.md has
  # the sweep and docs/images/obliquity_vs_error.png plots it.
  max_obliquity: 1.4

trust:
  # PLACEHOLDER. Weights blending mean landmark confidence with the geometric
  # plausibility score into one trust number.
  weight_landmark_confidence: 0.5
  weight_plausibility: 0.5
  # PLACEHOLDER. Below this, the fish goes to the human review queue.
  review_below: 0.6

decide:
  # PLACEHOLDER. Spinal curvature index above this (on a trusted reading) is a cull.
  # Units: max midline deviation from the snout-fork axis, divided by fork length.
  curvature_cull_above: 0.06

  # Whether the running detector can measure spinal curvature at all.
  #
  # True with the stub, which places twelve landmarks including the dorsal,
  # ventral and peduncle points a midline needs. MUST BE SET FALSE when running
  # the trained model: it emits four landmarks (snout, caudal fork, dorsal
  # origin, eye) because that is all the public dataset annotates, so curvature
  # is None on every fish. Leave this true with that model and 100% of the stock
  # lands in the review queue — measured, not guessed: 25 of 25 on the first run.
  #
  # Setting it false does not disable culling silently. Every decision made
  # under it carries a "DEFORMITY NOT ASSESSED" reason on the record.
  assess_deformity: true

plausibility:
  # PLACEHOLDER ranges. Sanity bounds on dimensionless body proportions — these
  # catch confident-but-anatomically-nonsense predictions. Numbers are eyeballed
  # from what a healthy fish roughly looks like, not fitted to any dataset.
  depth_ratio_min: 0.12
  depth_ratio_max: 0.45
  peduncle_to_depth_ratio_min: 0.20
  peduncle_to_depth_ratio_max: 0.85
  # Minimum separation, in pixels, before two landmarks count as degenerate.
  min_landmark_separation_px: 2.0

  # MEASURED, not placeholders. These four came off the 245 ground-truth
  # annotations in the Fish Measurement dataset and were then widened so real
  # biological variation isn't punished. Distributions are in docs/DATASETS.md.
  #   eye:    ground truth spans 0.042-0.162 of fork length  -> allow 0.02-0.25
  #   dorsal: ground truth spans 0.404-0.546 of fork length  -> allow 0.30-0.65
  # Both are axial positions measured back from the snout along the snout->fork
  # axis, divided by fork length, so they're scale-free and survive calibration
  # error.
  eye_axial_min: 0.02
  eye_axial_max: 0.25
  dorsal_axial_min: 0.30
  dorsal_axial_max: 0.65

measure:
  # PLACEHOLDER, all three. These turn a model confidence into a positional
  # standard deviation in pixels, and nobody has measured what a confidence of
  # 0.7 is actually worth on this model — there is no trained model yet. The
  # shape of the mapping is a guess; only the ordering it produces means
  # anything today. Phase 2 can fit these from a validation split.
  sigma_at_conf1_px: 0.8   # positional sigma at confidence 1.0
  sigma_at_conf0_px: 6.0   # positional sigma at confidence 0.0

  # PLACEHOLDER. Assumed calibration-target corner error, in pixels, used only
  # where a real residual isn't available (the ArUco path — see the note at the
  # top of pipeline/calibrate.py about why a 4-point solve can't produce one).
  assumed_corner_error_px: 0.5

detector:
  # Which detector actually runs. One of: stub | yolo
  # `yolo` needs `weights` to point at a trained .pt file; if it's missing or
  # ultralytics isn't installed, the code falls back to the stub, says so on
  # stdout, and tags every record with the backend that really ran.
  backend: stub
  weights: runs/pose/fishmeasure_4kp/weights/best.pt
  conf_threshold: 0.25
  device: mps

  # The real model's keypoint order, in ITS order; detect_yolo.py builds the
  # permutation onto SCHEMA. The Fish Measurement export ships no keypoint names
  # at all — only `kpt_shape: [4, 3]` — so these four were read off the rendered
  # annotations, not off a schema file. docs/DATASETS.md has the pictures.
  keypoint_order:
    - snout_tip      # model kp 0
    - caudal_fork    # model kp 1
    - dorsal_origin  # model kp 2
    - eye_centre     # model kp 3

  # Stub settings below. Only read when backend is `stub`.
  # One of: normal | low_confidence | implausible | deformed | no_detection
  stub_mode: normal
  # Frame-to-frame jitter the stub adds, in pixels, so the UI looks alive.
  stub_jitter_px: 1.5
  # Bows the stub fish's midline, as a fraction of body length. 0.0 is straight.
  # This is how the CULL path gets exercised without a real deformed fish.
  stub_bend: 0.0

live:
  # What the web app grades when it starts. Same spec the batch CLI takes: a
  # video file, a directory of images, a camera index, or the word "webcam".
  # It defaults to the synthetic sample clip so a fresh clone has something to
  # show — `python -m cli.make_sample` writes it. There are no fish in it.
  source: data/sample
  # Frames per second the live loop grades at. Low on purpose: this is one
  # operator looking at one tray, not a video pipeline.
  fps: 6.0
  loop: true
  save_frames: false

paths:
  db: data/fingerling.db
  frames: data/frames
  exports: data/exports
